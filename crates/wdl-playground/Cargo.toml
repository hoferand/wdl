[package]
name = "wdl-playground"
version = "0.1.0"
edition = "2024"

[dependencies]
format = { path = "../format", features = ["interpreter"] }
interpreter = { path = "../interpreter", features = ["playground"] }
parser = { path = "../parser" }
router = { path = "../router" }

axum = "0.8.8"
serde_json = "1.0.149"
socketioxide = "0.18.2"
tokio = { version = "1.51.1", features = [
	"macros",
	"net",
	"rt-multi-thread",
	"signal",
	"sync",
] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = [
	"fs",
	"cors",
	"compression-full",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
