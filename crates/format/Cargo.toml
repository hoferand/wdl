[package]
name = "format"
version = "0.1.0"
edition = "2024"

[features]
interpreter = ["dep:interpreter"]

[dependencies]
ast = { path = "../ast" }
interpreter = { path = "../interpreter", optional = true }
parser = { path = "../parser" }

colored = "3.1.1"
html-escape = "0.2.13"
serde = { version = "1.0.228", features = ["derive"] }
