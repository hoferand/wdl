<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
		<link rel="stylesheet" href="./styles/style.css" />
		<script src="./scripts/main.js" type="module"></script>
		<title>WDL Playground</title>
	</head>
	<body>
		<main id="playground">
			<h1 id="title">WDL Playground</h1>
			<div class="row" id="workspace">
				<!-- EDITOR START -->
				<section id="editor" class="container panel">
					<div class="panel-header">
						<h2 class="panel-title">Editor</h2>
						<a
							href="doc/"
							target="_blank"
							id="doc-btn"
							class="icon-button"
							aria-label="Open documentation"
						>
							<img
								src="./assets/question.svg"
								alt="Documentation"
								id="doc-img"
							/>
						</a>
						<button id="run-btn" class="button button-primary" type="button">
							Start
						</button>
					</div>
					<div id="editor-container"></div>
				</section>
				<!-- EDITOR END -->

				<!-- ROUTER START -->
				<aside id="router" class="container panel">
					<div class="panel-header">
						<h2 class="panel-title">Router</h2>
					</div>
					<p id="router-wait" class="panel-subtitle">Waiting for actions ...</p>
					<div id="router-request" hidden>
						<p id="action-text" class="field-label"></p>
						<pre><code id="target-area"></code></pre>
						<p id="router-status-label" class="field-label">Status:</p>
						<div class="row button-row">
							<button
								id="router-done-btn"
								class="button button-secondary"
								type="button"
							>
								Done
							</button>
							<button
								id="router-no-station-left-btn"
								class="button button-secondary"
								type="button"
							>
								No station left
							</button>
						</div>
					</div>
				</aside>
				<!-- ROUTER END -->
			</div>
			<!-- OUTPUT START -->
			<section id="output" class="container panel">
				<div class="panel-header">
					<h2 class="panel-title">Output</h2>
				</div>
				<pre><code id="output-area"></code></pre>
			</section>
			<!-- OUTPUT END -->
		</main>
	</body>
</html>
